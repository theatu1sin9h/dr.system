[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-doctor"
version = "1.0.0"
description = "Know your PC. Understand its health. Open-source system diagnostics, health scoring, and safe maintenance software."
readme = "README.md"
authors = [{ name = "[YOUR NAME]" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
linux-doctor = "linux_doctor.main:main"
linux-doctor-gui = "linux_doctor.main:gui_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
