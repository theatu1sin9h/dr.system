[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-system"
version = "2.5.0"
description = "Dr. System - Know your PC. Understand its health. Terminal PC Hardware Diagnostic & Clinical Health Scoring Doctor."
readme = "README.md"
authors = [{ name = "Atul Singh Chandel" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
dr-system = "linux_doctor.main:main"
linux-doctor = "linux_doctor.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
